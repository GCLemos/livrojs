<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <title>Document</title>
</head>

<body>
    <h1>Guess the Number</h1>
    <form>
        <p>Number:
            <input type="number" min="1" max="100" id="inNumber" required autofocus>
            <input type="submit" value="Gamble" id="btnSubmit">
            <input type="button" value="Play Again" id="btnNew" class="hidden">
        </p>
    </form>
    <h3>Mistakes: <span id="outMistakes">0</span></h3>
    <h3>Chances: <span id="outChances">6</span></h3>
    <h3 id="outTip" class="italic">Tip: It's a number between 0 and 100</h3>
    <script src="js/ex6_2.js"></script>
</body>

</html>
